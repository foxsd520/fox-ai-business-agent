<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoxSD AI | وكيل ذكاء تجاري</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="logo-box">
          <h2>🦊 FoxSD AI</h2>
          <p>وكيل ذكاء تجاري</p>
          <small>foxsd520@gmail.com</small>
        </div>

        <nav class="nav-menu">
          <button class="nav-item active" data-tab="chat">💬 المحادثة</button>
          <button class="nav-item" data-tab="training">📚 التدريب</button>
          <button class="nav-item" data-tab="history">📜 السجل</button>
          <button class="nav-item" data-tab="stats">📊 الإحصائيات</button>
        </nav>
      </aside>

      <main class="main-content">
        <!-- Chat Tab -->
        <section id="chat" class="tab-content active">
          <div class="chat-container">
            <div class="chat-header">
              <h1>🦊 FoxSD AI</h1>
              <p>متخصص في البرمجة، الأمن السيبراني، وتطوير المواقع والتطبيقات</p>
            </div>

            <div class="messages-box" id="messagesBox"></div>

            <div class="input-area">
              <textarea
                id="userInput"
                placeholder="اسأل عن البرمجة، الأمن السيبراني، تطوير المواقع أو التطبيقات..."
              ></textarea>
              <button id="sendBtn" class="send-btn">إرسال 🚀</button>
            </div>
          </div>
        </section>

        <!-- Training Tab -->
        <section id="training" class="tab-content">
          <div class="panel">
            <h2>إضافة مادة تدريبية</h2>
            <form id="trainingForm">
              <div class="form-group">
                <label>الفئة:</label>
                <select id="trainCategory" required>
                  <option value="">اختر الفئة</option>
                  <option value="programming">البرمجة</option>
                  <option value="cybersecurity">الأمن السيبراني</option>
                  <option value="web-development">تطوير المواقع</option>
                  <option value="app-development">تطوير التطبيقات</option>
                  <option value="business">الأعمال التجارية</option>
                </select>
              </div>

              <div class="form-group">
                <label>المحتوى:</label>
                <textarea id="trainContent" required></textarea>
              </div>

              <div class="form-group">
                <label>الكلمات المفتاحية (مفصولة بفواصل):</label>
                <input type="text" id="trainKeywords" />
              </div>

              <button type="submit" class="btn-primary">إضافة المادة</button>
            </form>
          </div>
        </section>

        <!-- History Tab -->
        <section id="history" class="tab-content">
          <div class="panel">
            <h2>سجل المحادثات</h2>
            <div id="historyBox"></div>
          </div>
        </section>

        <!-- Stats Tab -->
        <section id="stats" class="tab-content">
          <div class="panel">
            <h2>إحصائيات النظام</h2>
            <div class="stats-grid">
              <div class="stat-card">
                <span class="stat-label">إجمالي المحادثات</span>
                <span class="stat-value" id="statConversations">0</span>
              </div>
              <div class="stat-card">
                <span class="stat-label">مواد التدريب</span>
                <span class="stat-value" id="statTraining">0</span>
              </div>
              <div class="stat-card">
                <span class="stat-label">المستخدمون</span>
                <span class="stat-value" id="statUsers">0</span>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
